<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Billy - Educación Financiera y Acceso</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts para una tipografía moderna y agradable -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Cabecera de la aplicación -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">📈</div>
                <h1>Finance Billy</h1>
            </div>
            <p class="app-subtitle">Tu plataforma de finanzas personales</p>
        </header>

        <!-- Tarjeta principal que contiene el sistema de pestañas y formularios -->
        <main class="card">
            <!-- Pestañas de navegación interna (Tabs) -->
            <div class="tabs" role="tablist">
                <button id="tabLogin" class="tab tab-active" role="tab" aria-selected="true">Iniciar Sesión</button>
                <button id="tabRegister" class="tab" role="tab" aria-selected="false">Registrarse</button>
            </div>

            <!-- Contenedor de mensajes globales de éxito o error -->
            <div id="globalMessage" class="message hidden" aria-live="polite"></div>

            <!-- VISTA 1: Formulario de Inicio de Sesión -->
            <section id="loginSection" class="form-section">
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="loginUser">Usuario o ID</label>
                        <input type="text" id="loginUser" name="loginUser" class="input" placeholder="Ej. Amy123" required autocomplete="username">
                        <span class="error-text" id="loginUserError"></span>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" name="loginPassword" class="input" placeholder="••••••••" required autocomplete="current-password">
                        <span class="error-text" id="loginPasswordError"></span>
                    </div>

                    <button type="submit" id="loginBtn" class="btn btn-primary">
                        <span class="btn-text">Iniciar Sesión</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>
            </section>

            <!-- VISTA 2: Formulario de Registro -->
            <section id="registerSection" class="form-section hidden">
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="regUser">ID o Usuario</label>
                        <input type="text" id="regUser" name="regUser" class="input" placeholder="Elige un usuario único" required autocomplete="username">
                        <span class="error-text" id="regUserError"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="regName">Nombre</label>
                            <input type="text" id="regName" name="regName" class="input" placeholder="Tu nombre" required autocomplete="given-name">
                            <span class="error-text" id="regNameError"></span>
                        </div>
                        <div class="form-group">
                            <label for="regLastName">Apellido</label>
                            <input type="text" id="regLastName" name="regLastName" class="input" placeholder="Tu apellido" required autocomplete="family-name">
                            <span class="error-text" id="regLastNameError"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Correo Electrónico</label>
                        <input type="email" id="regEmail" name="regEmail" class="input" placeholder="correo@ejemplo.com" required autocomplete="email">
                        <span class="error-text" id="regEmailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Contraseña</label>
                        <input type="password" id="regPassword" name="regPassword" class="input" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                        <span class="error-text" id="regPasswordError"></span>
                    </div>

                    <button type="submit" id="registerBtn" class="btn btn-primary">
                        <span class="btn-text">Crear Cuenta</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>
            </section>
        </main>

        <!-- Pie de página con control de sonido opcional y créditos -->
        <footer class="app-footer">
            <div class="sound-control">
                <label for="soundToggle" class="sound-label">
                    <span>🔊 Efectos de sonido</span>
                    <input type="checkbox" id="soundToggle" checked>
                </label>
            </div>
            <p>Proyecto Educativo con crecimiento moderado</p>
        </footer>
    </div>

    <!-- Vinculación del script de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
